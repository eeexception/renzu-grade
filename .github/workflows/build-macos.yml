name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake ninja
      - name: Ensure Metal compiler exists
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Verify prerequisites
        run: ./scripts/bootstrap_macos.sh
      - name: Build and test
        run: ./scripts/test.sh --release --arch '${{ matrix.arch }}'
      - name: Package and verify
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: renzu-grade-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
