name: Windows and Linux CPU build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows x64 / MSVC / CPU
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: ./scripts/build-windows.ps1 -RunTests -Package
      - name: Verify archive and load packaged plugin
        run: |
          $archives = @(Get-ChildItem build-windows/dist/*.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows archive.' }
          $archive = $archives[0]
          $expected = (Get-Content ($archive.FullName + '.sha256') -Raw).Trim().Split()[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expected) {
            throw 'Archive checksum mismatch.'
          }
          Expand-Archive $archive.FullName -DestinationPath "$env:RUNNER_TEMP/renzu-package"
          $root = Join-Path "$env:RUNNER_TEMP/renzu-package" $archive.BaseName
          foreach ($path in @('INSTALL.txt', 'LICENSE', 'OPENFX-LICENSE.md', 'Source/renzu-grade/CMakeLists.txt')) {
            if (-not (Test-Path (Join-Path $root $path))) { throw "Missing packaged file: $path" }
          }
          & ./build-windows/Release/renzu_ofx_tests.exe "$root/RenzuGrade.ofx.bundle/Contents/Win64/RenzuGrade.ofx"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged plugin failed the OpenFX contract.' }
          & "$root/Source/renzu-grade/scripts/build-windows.ps1" -RunTests -BuildDirectory "$env:RUNNER_TEMP/renzu-source-build"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged source failed to build/test.' }
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: renzu-grade-windows-x86_64-cpu-only
          path: |
            build-windows/dist/*.zip
            build-windows/dist/*.sha256
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-x86_64
          path: build-windows/Testing/Temporary/
          if-no-files-found: ignore

  linux:
    name: Linux x86_64 / GCC / CPU / glibc 2.28
    runs-on: ubuntu-22.04
    # An older glibc baseline supports Rocky Linux 8 and newer glibc systems.
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: ./scripts/build-linux.sh --test --package
      - name: Verify Linux binary compatibility
        run: ./scripts/verify-linux.sh build-linux/RenzuGrade.ofx.bundle 2.28
      - name: Verify archive and load packaged plugin
        run: |
          cd build-linux/dist
          sha256sum --check ./*.sha256
          mkdir -p "$RUNNER_TEMP/renzu-package"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/renzu-package"
          root=("$RUNNER_TEMP"/renzu-package/renzu-grade-*)
          test "${#root[@]}" -eq 1
          for path in INSTALL.txt LICENSE OPENFX-LICENSE.md Source/renzu-grade/CMakeLists.txt; do
            test -s "${root[0]}/$path"
          done
          cd "$GITHUB_WORKSPACE"
          ./scripts/verify-linux.sh "${root[0]}/RenzuGrade.ofx.bundle" 2.28
          ./build-linux/renzu_ofx_tests "${root[0]}/RenzuGrade.ofx.bundle/Contents/Linux-x86-64/RenzuGrade.ofx"
          "${root[0]}/Source/renzu-grade/scripts/build-linux.sh" --test --build-dir "$RUNNER_TEMP/renzu-source-build"
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: renzu-grade-linux-x86_64-cpu-only
          path: |
            build-linux/dist/*.tar.gz
            build-linux/dist/*.sha256
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-x86_64
          path: build-linux/Testing/Temporary/
          if-no-files-found: ignore

  linux-sanitizers:
    name: Linux CPU / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with sanitizers
        run: ./scripts/build-linux.sh --debug --sanitize --test --build-dir build-linux-asan
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-sanitizers
          path: build-linux-asan/Testing/Temporary/
          if-no-files-found: ignore
